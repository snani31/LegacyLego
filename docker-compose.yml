volumes:
 postgres-legacy-lego-data:
 seq-legacy-lego-data:

networks:
  legacy-lego-network:
    driver: bridge

services:
 legacy-lego-postgres:
  image: postgres:16-alpine
  container_name: legacy-lego-postgres
  env_file:
   - .env
  networks:
   - legacy-lego-network
  ports:
   - "5432:5432"
  environment: 
   POSTGRES_PASSWORD: ${DB_PASSWORD}
   POSTGRES_USER: ${DB_USER}
   POSTGRES_DB: ${DB_NAME}
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
   interval: 5s
   timeout: 5s
   retries: 3
  restart: unless-stopped
  volumes:
   - postgres-legacy-lego-data:/var/lib/postgresql/data
 legacy-lego-seq:
  image: datalust/seq:2025.2
  container_name: legacy-lego-seq
  env_file:
   - .env
  networks:
   - legacy-lego-network
  environment:
   - ACCEPT_EULA=Y
   - SEQ_PASSWORD=${SEQ_PASSWORD}
  ports:
   - "8081:80"
   - "5341:5341"
  volumes:
   - seq-legacy-lego-data:/data
  restart: unless-stopped