name: LegacyLego CI

# Триггеры запуска пайплайна
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Глобальные переменные окружения для пайплайна
env:
  DOTNET_VERSION: "10.0.x"

jobs:
  # Сборка и прогон Юнит-тестов (Domain)
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Установка кода репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Установка и кэширование .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Шаг 3: Restore зависимостей NuGet
      - name: Restore dependencies
        run: dotnet restore

      # Шаг 4: Компиляция no-restore резила только для домена
      - name: Build solution
        run: dotnet build tests/LegacyLego.Domain.Tests/LegacyLego.Domain.Tests.csproj --configuration Release --no-restore

      # Шаг 5: Прогон доменных тестов LegacyLego.Domain.Tests
      - name: Run Domain Unit Tests
        run: dotnet tests/LegacyLego.Domain.Tests/bin/Release/net10.0/LegacyLego.Domain.Tests.dll
