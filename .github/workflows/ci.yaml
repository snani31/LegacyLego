name: LegacyLego CI

# Триггеры запуска пайплайна
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Глобальные переменные окружения для пайплайна
env:
  DOTNET_VERSION: "10.0.x"

jobs:
  # =========================================================================
  # JOB 1: Сборка и прогон Юнит-тестов (Domain)
  # =========================================================================
  domain-tests:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Установка кода репозитория на виртуальную машину
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Установка и кэширование .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Шаг 3: Restore зависимостей NuGet
      - name: Restore dependencies
        run: dotnet restore

      # Шаг 4: Компиляция no-restore резила только для домена
      - name: Build Domain Unit Tests
        run: dotnet build tests/LegacyLego.Domain.Tests/LegacyLego.Domain.Tests.csproj --configuration Release --no-restore

      # Шаг 5: Прогон доменных тестов LegacyLego.Domain.Tests
      - name: Run Domain Unit Tests
        run: dotnet tests/LegacyLego.Domain.Tests/bin/Release/net10.0/LegacyLego.Domain.Tests.dll

  # =========================================================================
  # JOB 2: Сборка и прогон Интеграционных тестов (Testcontainers + Docker)
  # Запускается после успешного прохождения domain-tests
  # =========================================================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: domain-tests # Гарантирует порядок выполнения

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Integration Tests
        run: dotnet build tests/LegacyLego.IntegrationTests/LegacyLego.IntegrationTests/LegacyLego.IntegrationTests.csproj --configuration Release --no-restore -p:OpenApiGenerateDocumentsOnBuild=false

      - name: Run Integration Tests
        run: dotnet tests/LegacyLego.IntegrationTests/LegacyLego.IntegrationTests/bin/Release/net10.0/LegacyLego.IntegrationTests.dll
