user nginx;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server_tokens off;

	limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
	limit_req_status 429;

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	upstream legacy_lego_api {
		# Если сервер ответил ошибкой 3 раза за 10 секунд,
		# Nginx исключит его из балансировки на 10 секунд
		server legacy-lego-api:8080 max_fails=3 fail_timeout=10s;
	}

	access_log /var/log/nginx/access.log combined;
	error_log /var/log/nginx/error.log warn;

	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
	text/plain
	text/css
	text/javascript
	text/xml
	application/json
	application/javascript
	application/xml
	application/xml+rss
	application/problem+json
	image/svg+xml;

	server {
		listen 80;
		server_name localhost;

		# ВНУТРЕННИЙ DNS DOCKER (Обязателен при использовании переменных в proxy_pass)
		resolver 127.0.0.11 valid=30s ipv6=off;

		# Проксирование RabbitMQ Management UI
		location /rabbitmq/ {
			# ВАЖНО: Без слэша на конце!
			proxy_pass http://legacy-lego-rabbitmq:15672;
			proxy_http_version 1.1;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}


		# Проверка самого Nginx сервара (Healthcheck)
		location = /health {
			access_log off;
			add_header Content-Type text/plain;
			return 200 'OK';
		}

		# Healthcheck LegacyLego ASP.NET Core приложения
		location = /api/health {
			access_log off;
			proxy_pass http://legacy-lego-api:8080/healthz; # Проксируем на внутренний /healthz приложения

			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
		}

		# Отдача статической фавиконки (если папки/файла нет, Nginx отдаст 404 без падения)
		location = /favicon.ico {
			root /usr/share/nginx/static/favicon;
			access_log off;
			log_not_found off;
			expires 30d;
		}

		# Статистика GoAccess Дашборд
		location /stats/ {
			alias /var/www/goaccess/;
			index index.html;

			auth_basic "LegacyLego Analytics Area";
			auth_basic_user_file /etc/nginx/.htpasswd;

		}

		# Проксирование всех запросов к API
		location / {
			proxy_pass http://legacy_lego_api;
			proxy_http_version 1.1;

			limit_req zone=api_limit burst=20 nodelay;

			# Если подконтейнер вернул ошибку или таймаут,
			# Переправить этот же запрос на СЛЕДУЮЩИЙ живой контейнер
			proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;

			# Защита от кэширования, чтобы браузер всегда запрашивал свежий HTML
			add_header Cache-Control "no-cache, no-store, must-revalidate" always;
			add_header X-Frame-Options "SAMEORIGIN" always;
			add_header X-Content-Type-Options "nosniff" always;

			access_log /var/log/nginx/access-api.log combined;
			error_log /var/log/nginx/error-api.log warn;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			proxy_connect_timeout 60s;
			proxy_send_timeout 60s;
			proxy_read_timeout 60s;
		}

		location /seq/ {
			proxy_pass http://legacy-lego-seq:80/;
			proxy_http_version 1.1;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Дополнительный слой защиты на уровне Nginx
			auth_basic "Logs Admin Area";
			auth_basic_user_file /etc/nginx/.htpasswd;
		}

		location /redcomm {
			proxy_pass http://legacy-lego-redis-commander:8081;
			proxy_http_version 1.1;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# Дополнительный слой защиты на уровне Nginx
			auth_basic "Cache Admin Area";
			auth_basic_user_file /etc/nginx/.htpasswd;
		}

		# Keycloak (Identity Provider)
		location /auth/ {
			proxy_pass http://legacy-lego-keycloak:8080/auth/;
			proxy_http_version 1.1;

			# Передача оригинальных заголовков клиента
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			proxy_set_header X-Forwarded-Port $server_port;

			# Защита от проблем с WebSocket/SSO редиректами
			proxy_buffer_size 128k;
			proxy_buffers 4 256k;
			proxy_busy_buffers_size 256k;
		}
	}
}
