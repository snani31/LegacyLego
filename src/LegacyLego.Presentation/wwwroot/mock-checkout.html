<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Payment Gateway</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #111827; }
        .details { text-align: left; background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #4b5563; }
        .details p { margin: 5px 0; }
        .amount-display { font-size: 24px; font-weight: bold; color: #10b981; margin: 15px 0; }
        button { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-fail { background-color: #ef4444; color: white; }
        .btn-fraud { background-color: #f59e0b; color: white; }
        #status-message { margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Test Payment Provider</h2>
    
    <div class="amount-display" id="display-amount">0.00</div>
    
    <div class="details">
        <p><strong>Order ID:</strong> <span id="display-order"></span></p>
        <p><strong>Session:</strong> <span id="display-session"></span></p>
    </div>

    <button class="btn-success" onclick="sendWebhook('success')">💰 Pay Successfully</button>
    <button class="btn-fail" onclick="sendWebhook('fail')">❌ Decline Payment</button>
    <button class="btn-fraud" onclick="sendWebhook('success', true)">🕵️ Pay Partial Amount (Fraud)</button>

    <div id="status-message"></div>
</div>

<script>
    // 1. Читаем параметры из URL
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    const amount = params.get('amount');
    const currency = params.get('currency');
    const externalSessionId = params.get('externalSessionId');

    document.getElementById('display-amount').textContent = `${amount} ${currency}`;
    document.getElementById('display-order').textContent = orderId;
    document.getElementById('display-session').textContent = externalSessionId;

    async function sendWebhook(status, isFraud = false) {
        const statusEl = document.getElementById('status-message');
        statusEl.textContent = 'Sending webhook...';
        statusEl.style.color = '#6b7280';

        const finalAmount = isFraud ? parseFloat(amount) - 100 : parseFloat(amount);

        const payload = {
            transactionId: externalSessionId,
            orderId: orderId,
            amount: finalAmount,
            currency: currency,
            status: status
        };

        try {
            // Маршрут к твоему вебхуку (убедись, что порт и путь верные)
            const response = await fetch('/mock/api/webhooks/payment', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusEl.textContent = `Webhook delivered! Status: ${status}. You can close this page.`;
                statusEl.style.color = '#10b981';
            } else {
                const err = await response.text();
                statusEl.textContent = `API Error: ${response.status} - ${err}`;
                statusEl.style.color = '#ef4444';
            }
        } catch (error) {
            statusEl.textContent = `Network Error: ${error.message}`;
            statusEl.style.color = '#ef4444';
        }
    }
</script>

</body>
</html>
